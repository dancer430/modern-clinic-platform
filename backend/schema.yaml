components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        doctor:
          type: integer
        doctor_name:
          type: string
          readOnly: true
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        reason:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        confirm_info:
          type: string
          readOnly: true
        diagnosis_result:
          type: string
          readOnly: true
        treatment_plan:
          type: string
          readOnly: true
        medical_advice:
          type: string
          readOnly: true
        attachments:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_date
      - appointment_time
      - attachments
      - confirm_info
      - created_at
      - diagnosis_result
      - doctor
      - doctor_name
      - id
      - medical_advice
      - patient
      - patient_name
      - status
      - treatment_plan
      - updated_at
    LoginToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
    PaginatedAppointmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - current_password
      - new_password
    PatchedAppointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        doctor:
          type: integer
        doctor_name:
          type: string
          readOnly: true
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        reason:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        confirm_info:
          type: string
          readOnly: true
        diagnosis_result:
          type: string
          readOnly: true
        treatment_plan:
          type: string
          readOnly: true
        medical_advice:
          type: string
          readOnly: true
        attachments:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPlatformSetting:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        platform_name:
          type: string
          maxLength: 120
        logo_data:
          type: string
        logo_type:
          type: string
          maxLength: 50
        logo_size:
          type: integer
          nullable: true
        updated_at:
          type: string
